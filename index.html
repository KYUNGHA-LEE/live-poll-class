<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>라이브 폴 · 참여하기</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendard-dynamic-subset.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    // ?mode=admin → 강사 화면. 아무 쿼리도 없으면 아래 학생 화면이 그대로 뜬다.
    (function () {
      const p = new URLSearchParams(location.search);
      const mode = (p.get("mode") || "").toLowerCase();
      if (mode === "admin" || mode === "host" || mode === "teacher") {
        location.replace("host" + (p.has("demo") ? "?demo=1" : ""));
      }
    })();
  </script>
</head>
<body>
  <div class="wrap" style="max-width:560px">
    <div class="hero-blobs">
      <div class="b b1"></div><div class="b b2"></div><div class="b b3"></div>
    </div>

    <div id="err" class="err hidden"></div>

    <!-- 1) 참여 코드 입력 (링크/QR로 들어오면 건너뜀) -->
    <section id="codeGate" class="card center hidden">
      <div class="eyebrow">실시간 참여 · LIVE POLL</div>
      <h1 style="font-size:44px; margin:8px 0 6px">라이브 폴</h1>
      <p class="muted">화면에 있는 <b>참여 코드</b>를 입력하세요.</p>
      <input type="text" id="codeInput" class="code-entry" placeholder="A B C 1 2 3"
             maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" />
      <button id="codeBtn" style="margin-top:14px; width:100%">참여하기 →</button>
    </section>

    <!-- 2) 이름 입력 -->
    <section id="nameGate" class="card center hidden">
      <h1>참여하기</h1>
      <p class="muted">코드 <b id="codeShow"></b></p>
      <label style="text-align:left">이름 (또는 익명)</label>
      <input type="text" id="nameInput" placeholder="비워두면 익명으로 참여돼요" maxlength="20" />
      <button id="joinBtn" style="margin-top:12px; width:100%">참여하기 →</button>
    </section>

    <!-- 3) 참여 후 -->
    <section id="live" class="hidden">
      <div class="card row between">
        <span class="pill" id="whoami">👤</span>
        <span class="pill">참여 <b id="ptCount" style="margin-left:6px">0</b>명</span>
      </div>

      <div id="waiting" class="card waiting">
        강사가 질문을 시작하기를 기다리는 중…
      </div>

      <div id="qcard" class="card hidden">
        <div class="question-title" id="qTitle" style="font-size:24px"></div>
        <div id="answerArea"></div>
        <p id="doneMsg" class="muted center hidden" style="margin-top:14px">✅ 제출됐어요! 언제든 바꿀 수 있어요.</p>
      </div>
    </section>
  </div>

  <script type="module" src="play.js"></script>
</body>
</html>
